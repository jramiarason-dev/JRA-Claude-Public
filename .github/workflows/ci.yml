name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  auditiq:
    name: AuditIQ tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit_system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: audit_system/requirements.txt

      - run: pip install -r requirements.txt

      - name: Unit tests
        env:
          # The app refuses to render without a key; no request is ever sent
          # because the smoke test only exercises static (no-API) mode.
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
        run: python -m unittest discover -s tests -v
