name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  auditiq:
    name: AuditIQ tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit_system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: audit_system/requirements.txt

      - run: pip install -r requirements.txt

      - name: Unit tests
        env:
          # The app refuses to render without a key; no request is ever sent
          # because the smoke test only exercises static (no-API) mode.
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
        run: python -m unittest discover -s tests -v

  mirage-city:
    name: Mirage City (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html à jour avec src/
        run: python3 mirage_city/build.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: node mirage_city/tests/smoke.mjs
